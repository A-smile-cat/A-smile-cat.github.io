<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">单周期处理器数据通路（支持 add / lw / sw / beq / j）</text>

  <!-- PC -->
  <rect x="30" y="150" width="60" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">PC</text>
  <!-- PC+4 -->
  <circle cx="60" cy="250" r="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="60" y="256" text-anchor="middle" font-size="14" fill="#111827">+4</text>
  <path d="M 60 194 L 60 232" stroke="#111827" stroke-width="1.5" marker-end="url(#aK)"/>

  <!-- IF/指令存储器 -->
  <rect x="130" y="130" width="110" height="84" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">指令存储器</text>
  <text x="185" y="186" text-anchor="middle" font-size="11" fill="#1e40af">IMem</text>
  <text x="185" y="204" text-anchor="middle" font-size="11" fill="#1e40af">inst = M[PC]</text>
  <path d="M 90 172 L 130 172" stroke="#111827" stroke-width="1.8"/>

  <!-- 寄存器堆 -->
  <rect x="330" y="120" width="120" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">寄存器堆</text>
  <text x="390" y="172" text-anchor="middle" font-size="11" fill="#1e40af">32 × 32-bit</text>
  <text x="390" y="190" text-anchor="middle" font-size="11" fill="#1e40af">读口 ×2 / 写口 ×1</text>
  <path d="M 240 172 L 330 172" stroke="#111827" stroke-width="1.8"/>
  <text x="285" y="164" text-anchor="middle" font-size="10" fill="#374151">指令字段 rs/rt/rd</text>

  <!-- 符号扩展 -->
  <rect x="300" y="280" width="80" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="340" y="305" text-anchor="middle" font-size="12" fill="#111827">符号扩展</text>
  <path d="M 390 230 L 390 280 L 360 280" stroke="#9ca3af" stroke-width="1.5" fill="none"/>

  <!-- ALUSrc MUX -->
  <polygon points="470,235 470,285 500,260" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="512" y="252" font-size="10" fill="#92400e">ALUSrc</text>
  <path d="M 340 300 L 470 275" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 450 225 L 470 245" stroke="#111827" stroke-width="1.8"/>

  <!-- ALU -->
  <rect x="510" y="200" width="100" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">ALU</text>
  <path d="M 500 260 L 510 255" stroke="#111827" stroke-width="1.8"/>
  <path d="M 450 225 L 510 225" stroke="#111827" stroke-width="1.8"/>

  <!-- 分支加法器 -->
  <circle cx="470" cy="90" r="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="470" y="95" text-anchor="middle" font-size="12" fill="#111827">+</text>
  <path d="M 340 300 L 300 300 L 300 90 L 454 90" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <text x="310" y="82" font-size="10" fill="#dc2626">imm&lt;&lt;2（字位移）</text>
  <path d="M 145 130 L 145 60 L 454 60" stroke="#111827" stroke-width="1.5" fill="none"/>
  <text x="250" y="52" font-size="10" fill="#374151">PC + 4</text>

  <!-- PCSrc MUX -->
  <polygon points="600,45 600,95 630,70" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="30" font-size="10" fill="#92400e">PCSrc = Branch · Zero</text>
  <path d="M 486 90 L 600 78" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M 145 60 L 600 62" stroke="#111827" stroke-width="1.5"/>
  <path d="M 630 70 L 700 70 L 700 40 L 60 40 L 60 148" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#aB)"/>
  <text x="380" y="32" font-size="10" fill="#2563eb">下一指令地址（顺序 or 分支目标 or 跳转目标）</text>

  <!-- 数据存储器 -->
  <rect x="660" y="190" width="110" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="715" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">数据存储器</text>
  <text x="715" y="246" text-anchor="middle" font-size="11" fill="#1e40af">DMem</text>
  <text x="715" y="264" text-anchor="middle" font-size="11" fill="#1e40af">lw / sw 访问</text>
  <path d="M 610 235 L 660 235" stroke="#111827" stroke-width="1.8"/>
  <text x="635" y="226" text-anchor="middle" font-size="10" fill="#374151">地址</text>

  <!-- MemtoReg MUX -->
  <polygon points="610,330 610,380 640,355" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="342" font-size="10" fill="#92400e">MemtoReg</text>
  <path d="M 715 280 L 715 340 L 640 360" stroke="#111827" stroke-width="1.5" fill="none"/>
  <path d="M 450 225 L 450 355 L 610 355" stroke="#111827" stroke-width="1.5" fill="none"/>
  <text x="530" y="348" font-size="10" fill="#374151">ALU 结果（R 型写回）</text>

  <!-- 写回 -->
  <path d="M 610 355 L 470 355 L 470 230" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#aG)"/>
  <text x="500" y="380" font-size="10" fill="#16a34a">写回寄存器堆（WR = rd 或 rt，由 RegDst 决定）</text>

  <!-- 控制器 -->
  <rect x="330" y="440" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="420" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">主控制器</text>
  <text x="420" y="486" text-anchor="middle" font-size="11" fill="#92400e">输入 op（+funct 给 ALU 控制）</text>
  <path d="M 240 214 L 300 214 L 300 440 L 360 440" stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="262" y="232" font-size="10" fill="#d97706">op 字段</text>
  <path d="M 510 470 L 880 470 L 880 300" stroke="#d97706" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#aO)"/>
  <text x="700" y="490" font-size="10" fill="#d97706">控制信号：RegDst · ALUSrc · MemtoReg · RegWrite · MemRead · MemWrite · Branch</text>

  <!-- ALU 控制 -->
  <rect x="30" y="440" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">ALU 控制器（二级译码）</text>
  <text x="130" y="486" text-anchor="middle" font-size="11" fill="#92400e">ALUOp(00/01/10) + funct → ALU 操作码</text>

  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="aK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111827"/></marker>
    <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">冯·诺依曼计算机的五大部件</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7280">实线 = 数据通路　虚线 = 控制信号与状态反馈</text>

  <!-- 存储器（顶部中央） -->
  <rect x="360" y="90" width="180" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">存储器</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#1e40af">存放数据与程序（指令）</text>

  <!-- 运算器（左中） -->
  <rect x="90" y="200" width="180" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">运算器（ALU）</text>
  <text x="180" y="248" text-anchor="middle" font-size="12" fill="#991b1b">算术 / 逻辑运算，结果暂存</text>

  <!-- 控制器（右中） -->
  <rect x="630" y="200" width="180" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#78350f">控制器（CU）</text>
  <text x="720" y="248" text-anchor="middle" font-size="12" fill="#92400e">指挥程序运行（PC / IR）</text>

  <!-- 输入设备（左下） -->
  <rect x="90" y="330" width="180" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="180" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">输入设备</text>

  <!-- 输出设备（右下） -->
  <rect x="630" y="330" width="180" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="720" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">输出设备</text>

  <!-- 数据线：输入 → 运算器 -->
  <path d="M 180 330 L 180 264" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
  <!-- 数据线：运算器 → 输出 -->
  <path d="M 180 264 L 180 330" stroke="none"/>
  <!-- 输入到存储器 -->
  <path d="M 270 352 L 450 352 L 450 158" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- 存储器 ↔ 运算器 -->
  <path d="M 360 130 L 220 130 L 220 200" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <path d="M 240 200 L 240 122 L 360 122" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- 运算器 → 输出 -->
  <path d="M 270 232 L 630 232 L 720 232 L 720 326" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
  <!-- 控制虚线：CU → 存储器 -->
  <path d="M 700 200 L 700 122 L 544 122" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrG)"/>
  <!-- 控制虚线：CU → 运算器 -->
  <path d="M 630 232 L 274 232" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrG)"/>
  <!-- 状态反馈：运算器 → CU -->
  <path d="M 240 264 L 240 300 L 680 300 L 680 264" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrG)"/>

  <!-- 注释 -->
  <text x="305" y="118" text-anchor="middle" font-size="11" fill="#2563eb">指令 / 数据</text>
  <text x="300" y="222" text-anchor="middle" font-size="11" fill="#9ca3af">控制信号</text>
  <text x="460" y="308" text-anchor="middle" font-size="11" fill="#9ca3af">状态反馈</text>

  <!-- 底部说明 -->
  <rect x="40" y="160" width="0" height="0" fill="none"/>
  <text x="450" y="416" text-anchor="middle" font-size="13" fill="#374151">核心思想「存储程序」：程序（指令）与数据一同存入存储器，机器启动后自动逐条取指、译码、执行，无需人工干预</text>
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>

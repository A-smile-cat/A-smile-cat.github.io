<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">计分板（CDC 6600，1964）：四阶段流水与冲突检测位置</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6b7280">ID 被拆成 Issue 和 Read Operands 两级，乱序执行发生在 Read Operands 阶段</text>

  <!-- 四个阶段 -->
  <g text-anchor="middle">
    <rect x="60"  y="90" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="145" y="120" font-size="16" font-weight="bold" fill="#1e3a8a">1. Issue 发射</text>
    <text x="145" y="146" font-size="12" fill="#1e40af">按序发射到功能部件</text>
    <text x="145" y="170" font-size="12" fill="#dc2626" font-weight="bold">检测：结构冲突</text>
    <text x="145" y="192" font-size="12" fill="#dc2626" font-weight="bold">　　　WAW</text>

    <rect x="260" y="90" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="345" y="120" font-size="16" font-weight="bold" fill="#1e3a8a">2. Read Operands</text>
    <text x="345" y="146" font-size="12" fill="#1e40af">操作数就绪后读取</text>
    <text x="345" y="174" font-size="12" fill="#dc2626" font-weight="bold">检测：RAW</text>
    <text x="345" y="196" font-size="12" fill="#16a34a" font-weight="bold">乱序执行发生于此</text>

    <rect x="460" y="90" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="545" y="120" font-size="16" font-weight="bold" fill="#1e3a8a">3. Execute</text>
    <text x="545" y="146" font-size="12" fill="#1e40af">功能部件执行</text>
    <text x="545" y="174" font-size="12" fill="#374151">完成后通知计分板</text>
    <text x="545" y="196" font-size="12" fill="#374151">（不同部件延迟不同）</text>

    <rect x="660" y="90" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="745" y="120" font-size="16" font-weight="bold" fill="#1e3a8a">4. Write Result</text>
    <text x="745" y="146" font-size="12" fill="#1e40af">写回寄存器</text>
    <text x="745" y="174" font-size="12" fill="#dc2626" font-weight="bold">检测：WAR</text>
    <text x="745" y="196" font-size="12" fill="#374151">必要时停顿等待</text>
  </g>
  <path d="M 230 150 L 260 150" stroke="#2563eb" stroke-width="2" marker-end="url(#aB3)"/>
  <path d="M 430 150 L 460 150" stroke="#2563eb" stroke-width="2" marker-end="url(#aB3)"/>
  <path d="M 630 150 L 660 150" stroke="#2563eb" stroke-width="2" marker-end="url(#aB3)"/>

  <!-- 三张表 -->
  <text x="60" y="258" font-size="15" font-weight="bold" fill="#111827">计分板维护三张表：</text>
  <g font-size="12.5" fill="#374151">
    <rect x="60" y="274" width="250" height="104" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="75" y="300" font-weight="bold" fill="#111827">① 指令状态表</text>
    <text x="75" y="322">每条指令处于四阶段中</text>
    <text x="75" y="342">的哪一步（完成打 √）</text>

    <rect x="325" y="274" width="250" height="104" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="340" y="300" font-weight="bold" fill="#111827">② 功能部件状态表</text>
    <text x="340" y="322">Busy / Op / Fi / Fj / Fk</text>
    <text x="340" y="342">Qj / Qk（谁产生操作数）</text>
    <text x="340" y="362">Rj / Rk（操作数是否就绪）</text>

    <rect x="590" y="274" width="250" height="104" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="605" y="300" font-weight="bold" fill="#111827">③ 寄存器结果状态表</text>
    <text x="605" y="322">每个寄存器将被哪个</text>
    <text x="605" y="342">功能部件写入</text>
  </g>

  <!-- Qj/Rj 规则 -->
  <rect x="60" y="402" width="780" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="428" font-size="13" font-weight="bold" fill="#1e3a8a">Rj / Rk 的规则：</text>
  <text x="78" y="450" font-size="12.5" fill="#1e40af">发射时源操作数就绪 → Rj=yes；未就绪 → Qj 记下「产生该值的功能部件」，Rj=no；部件完成写回后 Qj 清空、Rj 置 yes；</text>
  <text x="78" y="468" font-size="12.5" fill="#1e40af">当 Rj 与 Rk 同时为 yes 才能读取操作数并开始执行，读取后 Rj/Rk 重新置为 no（防止再次误判就绪）</text>

  <!-- 局限 -->
  <rect x="60" y="498" width="780" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="78" y="524" font-size="13" font-weight="bold" fill="#991b1b">计分板的局限（考试常考）：</text>
  <text x="78" y="546" font-size="12.5" fill="#7f1d1d">① WAW 在 Issue 检测、WAR 在 Write Result 检测，都只能靠停顿解决（没有消除）；② 不处理控制冲突，</text>
  <text x="78" y="564" font-size="12.5" fill="#7f1d1d">乱序执行只能局限在一个基本块内部；③ RAW 之外真正提速依赖功能部件足够多、寄存器文件多端口</text>

  <defs>
    <marker id="aB3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
  </defs>
</svg>

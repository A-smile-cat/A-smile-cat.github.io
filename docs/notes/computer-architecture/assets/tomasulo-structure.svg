<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Tomasulo 算法核心结构（IBM System/360 Model 91，1967）</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#6b7280">保留站 + 公共数据总线（CDB）+ 寄存器重命名：彻底消除 WAR / WAW</text>

  <!-- 指令来源 -->
  <rect x="330" y="80" width="220" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="110" text-anchor="middle" font-size="14" fill="#111827">取指 / 译码（按序）</text>

  <!-- RAT -->
  <rect x="90" y="80" width="190" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="185" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">重命名映射表 RAT</text>
  <text x="185" y="120" text-anchor="middle" font-size="11" fill="#5b21b6">寄存器 → 产生它的 tag</text>
  <path d="M 280 104 L 330 104" stroke="#111827" stroke-width="1.5" marker-end="url(#aK4)"/>

  <!-- 发射到 RS -->
  <path d="M 440 128 L 440 168" stroke="#2563eb" stroke-width="2" marker-end="url(#aB4)"/>
  <text x="452" y="152" font-size="11" fill="#2563eb">Issue：指令 + 重命名后的源（值或 tag）放入保留站（RS 满 → 停顿）</text>

  <!-- 保留站：加法 -->
  <rect x="180" y="172" width="240" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">加法保留站（每行一条指令）</text>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#1e40af">Busy · Op · Vj · Vk · Qj · Qk · A</text>
  <text x="300" y="248" text-anchor="middle" font-size="12" fill="#374151">V = 已就绪的源操作数值</text>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#374151">Q = 还没就绪时，「谁会产这个值」</text>
  <text x="300" y="294" text-anchor="middle" font-size="12" fill="#dc2626">边监听 CDB，边等自己的 tag</text>

  <!-- 保留站：乘法 -->
  <rect x="500" y="172" width="240" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">乘法保留站</text>
  <text x="620" y="222" text-anchor="middle" font-size="12" fill="#1e40af">结构与加法 RS 相同</text>
  <text x="620" y="248" text-anchor="middle" font-size="12" fill="#374151">每个功能部件一套 RS</text>
  <text x="620" y="270" text-anchor="middle" font-size="12" fill="#374151">双操作数齐 → 派发执行</text>
  <text x="620" y="294" text-anchor="middle" font-size="12" fill="#374151">load / store 用缓冲区（同构）</text>

  <!-- 功能部件 -->
  <rect x="240" y="360" width="120" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="300" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">加法器 FU</text>
  <rect x="560" y="360" width="120" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">乘法器 FU</text>
  <path d="M 300 312 L 300 360" stroke="#2563eb" stroke-width="2" marker-end="url(#aB4)"/>
  <path d="M 620 312 L 620 360" stroke="#2563eb" stroke-width="2" marker-end="url(#aB4)"/>

  <!-- CDB -->
  <rect x="120" y="452" width="680" height="52" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="460" y="475" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">公共数据总线 CDB（广播 tag + value）</text>
  <text x="460" y="494" text-anchor="middle" font-size="11" fill="#166534">结果一方面写寄存器堆，一方面送所有还在等这个 tag 的保留站 —— 天然实现前递</text>
  <path d="M 300 408 L 300 452" stroke="#16a34a" stroke-width="2" marker-end="url(#aG4)"/>
  <path d="M 620 408 L 620 452" stroke="#16a34a" stroke-width="2" marker-end="url(#aG4)"/>

  <!-- 寄存器堆 -->
  <rect x="120" y="530" width="200" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="220" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">寄存器堆</text>
  <text x="220" y="568" text-anchor="middle" font-size="11" fill="#1e40af">每个寄存器记着「最新写者 tag」</text>
  <path d="M 300 478 L 240 530" stroke="#16a34a" stroke-width="2" marker-end="url(#aG4)"/>
  <path d="M 240 530 L 200 504" stroke="#2563eb" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <text x="360" y="556" font-size="11.5" fill="#374151">广播 tag 与寄存器内的 tag 匹配 → 写入并置 valid；tag 回收（系统中不再有副本）</text>

  <!-- CDB 监听回环 -->
  <path d="M 200 452 C 160 400, 150 340, 180 312" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#aR4)"/>
  <text x="120" y="392" font-size="11" fill="#dc2626">RS 全体监听</text>

  <defs>
    <marker id="aB4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="aG4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
    <marker id="aR4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="aK4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#111827"/></marker>
  </defs>
</svg>
